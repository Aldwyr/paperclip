[workspace]
members = ["crates/runner-core"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
aes-gcm = "0.10"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
jsonschema = { version = "0.50", default-features = false }
aws-config = { version = "1.11", features = ["behavior-version-latest"] }
aws-sdk-bedrockagentcore = "1.63"
aws-sdk-sts = "1.112"
aws-smithy-types = "1.6"
aws-types = "1.3"
tokio = { version = "1.50", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1.22", features = ["v4"] }
